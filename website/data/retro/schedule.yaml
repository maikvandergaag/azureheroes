# Schedule for Azure Heroes: Retro 2027.
# Used when sessionize.embed_id in event.yaml is empty.
#
# `provisional: true` shows a banner that the timetable may still change.
# Each slot is either a plenary item (title only, spans all rooms) or a set of
# parallel sessions (one per room, in the same order as `rooms`).

provisional: true   # TODO: set to false once the programme is final

rooms: ["Main stage", "Room 2"]

# TODO: replace this outline with the real programme once the CFP has closed.
slots:
