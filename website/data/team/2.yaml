text: "I'm a technology leader and hands-on engineer with 16+ years of experience designing, building, and operating data and cloud platforms at scale. My expertise spans SQL Server, Azure Data Factory, Microsoft Fabric, cloud architecture, platform engineering, and mission-critical environments. I focus on defining technical direction, simplifying complexity, and turning challenging problems into reliable, scalable solutions. As founder of Azure Heroes, I bring people together around Microsoft Azure through events, speaking, and community-driven knowledge sharing."
