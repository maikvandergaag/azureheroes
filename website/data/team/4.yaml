text: "I’m a cloud security professional specializing in Microsoft Azure and Entra ID security research. With years of experience in offensive security, I focus on identifying privilege escalation paths, misconfigured identity controls, and attack vectors in cloud environments. My work centers on the intersection of identity security and cloud infrastructure, helping organizations understand their real-world attack surface before adversaries do."
