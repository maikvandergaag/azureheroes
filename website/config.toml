# Top bar social links menu
[[menu.topbar]]
    weight = 3
    name = "LinkedIn"
    url = "https://www.linkedin.com/company/azure-heroes"
    pre = "<i class='fab fa-2x fa-linkedin'></i>"

[params]
    noComment = true 
    viewMorePostLink = "/events/"
    author = "Azure Heroes"
    defaultKeywords = ["Azure Heroes", "Cloud", "Azure"]
    mainSections = ["events", "training"]
    defaultDescription = "Azure Heroes - Learn from Azure Heroes, Network and be part of a community."

    # Google Maps widget: If `googleMapsApiKey` is not set, no key will be passed to Google (which likely results in a broken map widget).
    enableGoogleMaps = false

    # Style options: default (light-blue), blue, green, marsala, pink, red, turquoise, violet
    style = "blue"

    contact_form_ajax = true

    #forms
    contact_action = "https://prod-79.westeurope.logic.azure.com:443/workflows/a7dc7d87b98e4042b14908726acc17b9/triggers/manual/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hzPTBm4zcqXLV5Htt68zM3z37nRllXZePH1Mf_-y9pE"

    enableRecaptchaInContactForm = false
    googleRecaptchaKey = "6LfaxtohAAAAAELRkS4CT4Dm0SPlc6Ttr4e48xIJ"

    about_us = "<p>Azure Heroes is a user group that focuses on anything Microsoft Azure.</p>"
    copyright = "Copyright (c) 2026, Azure Heroes; all rights reserved."

    # Format dates with Go's time formatting
    date_format = "January 2, 2006"

    disabled_logo = false
    logo_text = "Azure Heroes"

    logo = "img/logo-small.png"
    logo_small = "img/logo-small.png"
    contact_url = "/contact"
  

[permalinks]
    events = "/events/:year/:month/:day/"

# Enable or disable top bar with social icons
[params.topbar]
    enable = false   # LinkedIn is in the footer

# Enable and disable widgets for the right sidebar
[params.widgets]
    tags = false
    search = false

[params.carouselCustomers]
    items = 3
    auto_play = true
    slide_speed = 2000
    pagination_speed = 1000

[params.carouselTestimonals]
    items = 3
    auto_play = false
    slide_speed = 2000
    pagination_speed = 1000

[params.carouselHomepage]
    enable = true
    auto_play = true
    slide_speed = 2000
    pagination_speed = 1000


[params.testimonials]
    enable = true
    title = "Team"
    subtitle = ""

[params.team]
    enable = true
    title = "Team"
    subtitle = ""

# Home page hero (layouts/partials/carousel.html)
[params.hero]
    kicker = "Microsoft Azure community · Netherlands"
    title = "Azure Heroes User Group"
    lead = "Free meetups for everyone building on Microsoft Azure: practical sessions from community speakers, and plenty of time to learn from each other."
    image = "img/hero-heroes.jpg"
    image_alt = "Azure Heroes superhero mascot"

# Home page upcoming events, generated from content/events (layouts/partials/see_more.html)
[params.upcoming]
    title = "Upcoming events"
    limit = 3

[params.clients]
    enable = true
    title = "Sponsors"
    subtitle = ""

[params.sponsors]
    enable = true
    title = "Sponsors"
    subtitle = ""

[params.recent_posts]
    enable = false
    title = "From our blog"
    subtitle = "Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Vestibulum tortor quam, feugiat vitae, ultricies eget, tempor sit amet, ante. Donec eu libero sit amet quam egestas semper. Aenean ultricies mi vitae est. Mauris placerat eleifend leo."
    hide_summary = false

[params.recent_training]
    enable = false
    title = "Training"
    subtitle = "Discover our training sessions and educational content to enhance your Azure skills."
    hide_summary = false

# Highlighted button at the end of the main navigation (layouts/partials/nav.html)
[params.nav_cta]
    text = "Submit a talk"
    url = "/CFP/"

# Footer contact and social links (layouts/partials/footer.html)
[params.footer]
    email = "support@azureheroes.online"
    linkedin = "https://www.linkedin.com/company/azure-heroes"
    meetup = "https://www.meetup.com/azure-heroes-netherlands/"
    whatsapp = "/whatsapp-community/"

[params.footer.recent_posts]
    enable = true

[params.footer.recent_events]
    enable = true

[params.footer.recent_training]
    enable = true

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
