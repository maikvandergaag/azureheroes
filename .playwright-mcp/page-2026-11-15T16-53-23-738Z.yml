      - heading "Speaker Paul Stolk" [level=3] [ref=f1e57]
      - paragraph [ref=f1e58]:
        - strong [ref=f1e59]: Stop Prompting and Praying, Start Specifying
      - paragraph [ref=f1e60]: In this hands-on session, Paul will show how Spec-Driven Development can turn Copilot from a hopeful prompt box into a reliable engineering partner, building a full app in just 60 minutes.
