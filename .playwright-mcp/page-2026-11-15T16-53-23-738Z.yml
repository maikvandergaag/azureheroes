        - text: Azure Heroes is teaming up with
        - link "GitHub Dev Days" [ref=f1e40] [cursor=pointer]:
          - /url: https://github.com/scubaninja
        - text: for an evening of hands-on learning, community, AI, and plenty of Copilot.
      - heading "Featured speakers" [level=2] [ref=f1e41]
      - heading "Speaker April Yoho (Senior Developer Advocate @ GitHub)" [level=3] [ref=f1e42]
      - paragraph [ref=f1e43]:
        - strong [ref=f1e44]: "Ctrl+Alt+Delegate: Development in the Age of AI Agents"
      - paragraph [ref=f1e45]: April is a Senior Developer Advocate at GitHub, where she helps organizations modernize how they build, deploy, and operate software at scale. She specializes in application transformation and DevOps ways of working, with a strong focus on enabling enterprises to adopt modern, code-first practices using GitHub. April is actively involved in technical content creation and education, producing enterprise-focused blogs, videos, workshops, and presentations. Through speaking engagements, executive briefings, and community events, she shares practical, real-world insights to help teams successfully adopt modern DevOps practices.
      - paragraph [ref=f1e46]:
        - link " LinkedIn" [ref=f1e47] [cursor=pointer]:
          - /url: https://www.linkedin.com/in/aprilyoho/
        - link " GitHub" [ref=f1e48] [cursor=pointer]:
          - /url: https://github.com/scubaninja
      - heading "Speaker Rob Bos" [level=3] [ref=f1e49]
      - paragraph [ref=f1e50]:
        - strong [ref=f1e51]: "GitHub Copilot Surfaces: My Leveling Up with AI"
      - paragraph [ref=f1e52]: "GitHub Copilot is everywhere now: inline, in chat, in agent mode, in the CLI, the app, and the cloud. Rob will walk us through his journey of leveling up with Copilot and explain which surfaces matter most at each stage of your workflow."
      - paragraph [ref=f1e53]:
        - link " LinkedIn" [ref=f1e54] [cursor=pointer]:
